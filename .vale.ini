StylesPath = styles
MinAlertLevel = warning

Packages = Google

Vocab = Concord

[*.md]
BasedOnStyles = Vale, Google, Concord

# docfx alert syntax and Liquid-style tags are not prose.
BlockIgnores = (?s) *(\{% .* %\})

# Headings on this site are sentence case, which Google agrees with, but the
# rule fires on type names like CodeInstruction that must keep their casing.
Google.Headings = NO

# Concord targets mod authors reading alongside an IDE. "will" is fine here.
Google.Will = NO

# The API surface deliberately mirrors Harmony's lowercase member names.
Google.Acronyms = NO

# Reads a dotted identifier such as Concord.Ref or At.TranspilerFinal as two
# sentences and asks for a space between them.
Google.Spacing = NO

# Matches any word ending in "ly" before a hyphen, so it rejects correct
# compounds such as assembly-qualified and assembly-level.
Google.LyHyphens = NO

# Fires on a capitalised link title after a colon.
Google.Colons = NO

# Vocabulary terms are flagged whenever a sentence starts with one, because
# sentence-initial capitals read as inconsistent casing.
Vale.Terms = NO
